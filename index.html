<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>캔버스 뷰어</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none; /* 브라우저 기본 제스처 방지 */
    }
    
    /* 뷰어 최외곽 컨테이너 */
    #viewer-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 줌 및 이동이 적용되는 레이어 */
    #image-wrapper {
      position: relative;
      display: inline-block;
      line-height: 0;
      transform-origin: center center;
      will-change: transform;
    }

    #art-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* 사진 비율에 정확히 밀착되는 3x3 격자 */
    .grid-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      border: 1.5px solid rgba(255, 255, 255, 0.7);
    }

    .grid-cell {
      border-right: 1.5px solid rgba(255, 255, 255, 0.6);
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.6);
      box-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
    }
    .grid-cell:nth-child(3n) { border-right: none; }
    .grid-cell:nth-child(n+7) { border-bottom: none; }

    /* 좌하단 제어 버튼 패널 (자동 숨김) */
    .controls {
      position: absolute;
      bottom: 24px;
      left: 24px;
      display: flex;
      gap: 10px;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .controls.visible {
      opacity: 1;
      pointer-events: auto;
    }

    button {
      padding: 14px 20px;
      background: rgba(20, 20, 20, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active {
      background: rgba(60, 60, 60, 0.9);
    }
  </style>
</head>
<body>
  <div id="viewer-container">
    <div id="image-wrapper">
      <img id="art-image" src="" alt="참고 사진">
      
      <div id="grid" class="grid-overlay">
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      </div>
    </div>

    <!-- 좌하단 버튼 패널 -->
    <div id="controls" class="controls">
      <button onclick="toggleGrid(event)">격자 ON/OFF</button>
      <button onclick="fetchLatestImage(event)">새로고침</button>
      <button onclick="resetZoom(event)">원래 크기로</button>
    </div>
  </div>

  <script>
    // 본인의 Supabase 스토리지 공개 이미지 URL
    const IMAGE_URL = 'https://jklaeltxgptsredzhiof.supabase.co/storage/v1/object/public/drawings/latest.jpg';

    const container = document.getElementById('viewer-container');
    const wrapper = document.getElementById('image-wrapper');
    const img = document.getElementById('art-image');
    const controls = document.getElementById('controls');

    let hideTimer = null;

    // 변환(Zoom/Pan) 관련 변수
    let scale = 1;
    let translateX = 0;
    let translateY = 0;
    let startX = 0, startY = 0;
    let initialDistance = 0;
    let initialScale = 1;
    let hasMoved = false;

    // 1. 화면 크기에 맞게 꽉 채우기 (종횡비 유지 + 레터박스)
    function fitImageToScreen() {
      if (!img.naturalWidth || !img.naturalHeight) return;

      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const imgRatio = img.naturalWidth / img.naturalHeight;
      const screenRatio = vw / vh;

      let w, h;
      if (imgRatio > screenRatio) {
        w = vw;
        h = vw / imgRatio;
      } else {
        h = vh;
        w = vh * imgRatio;
      }

      wrapper.style.width = `${w}px`;
      wrapper.style.height = `${h}px`;
    }

    img.onload = () => {
      fitImageToScreen();
      resetZoom();
    };
    window.addEventListener('resize', fitImageToScreen);

    // 2. 변환 적용 함수
    function applyTransform(animate = false) {
      wrapper.style.transition = animate ? 'transform 0.25s ease-out' : 'none';
      wrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    // 3. 원래 크기로 복귀
    window.resetZoom = function(e) {
      if (e) e.stopPropagation();
      showControls();
      scale = 1;
      translateX = 0;
      translateY = 0;
      applyTransform(true);
    };

    // 4. 제스처(터치 핀치 줌 & 드래그 이동)
    container.addEventListener('touchstart', (e) => {
      if (e.target.closest('#controls')) return;
      hasMoved = false;

      if (e.touches.length === 1) {
        startX = e.touches[0].clientX - translateX;
        startY = e.touches[0].clientY - translateY;
      } else if (e.touches.length === 2) {
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialScale = scale;
      }
    }, { passive: false });

    container.addEventListener('touchmove', (e) => {
      if (e.target.closest('#controls')) return;
      e.preventDefault();

      if (e.touches.length === 1 && scale > 1) {
        hasMoved = true;
        translateX = e.touches[0].clientX - startX;
        translateY = e.touches[0].clientY - startY;
        applyTransform(false);
      } else if (e.touches.length === 2) {
        hasMoved = true;
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        scale = Math.min(Math.max(1, initialScale * (dist / initialDistance)), 6);
        if (scale === 1) {
          translateX = 0;
          translateY = 0;
        }
        applyTransform(false);
      }
    }, { passive: false });

    container.addEventListener('touchend', (e) => {
      if (e.target.closest('#controls')) return;
      if (e.touches.length === 0 && !hasMoved) {
        enableWakeLock();
        showControls();
      }
    });

    // 5. 버튼 자동 숨김 제어 (3초 뒤 서서히 사라짐)
    function showControls() {
      controls.classList.add('visible');
      if (hideTimer) clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        controls.classList.remove('visible');
      }, 3000);
    }

    // 6. 화면 꺼짐 방지
    async function enableWakeLock() {
      try {
        if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
      } catch (err) {}
    }

    // 7. 새로고침 및 격자 토글
    window.fetchLatestImage = function(e) {
      if (e) e.stopPropagation();
      showControls();
      img.src = `${IMAGE_URL}?t=${Date.now()}`;
    };

    window.toggleGrid = function(e) {
      if (e) e.stopPropagation();
      showControls();
      const g = document.getElementById('grid');
      g.style.display = g.style.display === 'none' ? 'grid' : 'none';
    };

    // 초기 로딩
    fetchLatestImage();
  </script>
</body>
</html>
