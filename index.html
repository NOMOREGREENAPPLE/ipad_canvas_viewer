<input type="file" id="fileInput" accept="image/*" capture="environment">
<button onclick="uploadImage()">아이패드로 전송</button>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
  const supabase = createClient('https://jklaeltxgptsredzhiof.supabase.co', 'sb_publishable_FcNQYW5uYOlAMiJblrSGIQ_nUc8QS6G')

  async function uploadImage() {
    const file = document.getElementById('fileInput').files[0]
    if (!file) return alert('사진을 선택해주세요!')
    
    // 항상 동일한 이름(latest.jpg)으로 덮어쓰거나, 타임스탬프를 붙여 업로드
    const { error } = await supabase.storage.from('drawings').upload('latest.jpg', file, {
      upsert: true
    })
    if (!error) alert('아이패드로 전송 완료되었습니다!')
  }
</script>
