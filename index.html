<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>캔버스 뷰어</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      user-select: none;
      -webkit-user-select: none;
    }
    
    /* 화면 전체 중앙 정렬 영역 */
    #viewer-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 사진의 실제 표시 크기만큼만 딱 맞춰지는 래퍼 */
    #image-wrapper {
      position: relative;
      display: inline-block;
      line-height: 0; /* 이미지 하단 미세 여백 제거 */
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
    }

    /* 화면에 맞게 비율 유지하며 줄어드는 이미지 */
    #art-image {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      width: auto;
      height: auto;
      pointer-events: none;
    }

    /* 사진 크기에 정확히 1:1로 일치하는 3x3 격자 */
    .grid-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      border: 1.5px solid rgba(255, 255, 255, 0.7); /* 사진 외곽선 */
    }

    .grid-cell {
      border-right: 1.5px solid rgba(255, 255, 255, 0.6);
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.6);
      /* 흰색 배경이나 어두운 배경 어디서든 선이 보이도록 그림자 추가 */
      box-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
    }

    /* 외곽 테두리와 겹쳐 두꺼워지는 현상 방지 */
    .grid-cell:nth-child(3n) {
      border-right: none;
    }
    .grid-cell:nth-child(n+7) {
      border-bottom: none;
    }

    /* 좌하단 제어 버튼 패널 (화면 기준 고정 & 자동 숨김) */
    .controls {
      position: absolute;
      bottom: 24px;
      left: 24px;
      display: flex;
      gap: 12px;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .controls.visible {
      opacity: 1;
      pointer-events: auto;
    }

    button {
      padding: 14px 22px;
      background: rgba(20, 20, 20, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active {
      background: rgba(60, 60, 60, 0.9);
    }
  </style>
</head>
<body>
  <div id="viewer-container" onclick="handleScreenTap(event)">
    <!-- 사진 크기에 딱 맞게 감싸는 영역 -->
    <div id="image-wrapper">
      <img id="art-image" src="" alt="참고 사진">
      
      <!-- 사진과 완전히 같은 크기로 쳐지는 3x3 격자선 -->
      <div id="grid" class="grid-overlay">
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      </div>
    </div>

    <!-- 좌측 하단 버튼 패널 (화면 모서리에 유지됨) -->
    <div id="controls" class="controls">
      <button onclick="toggleGrid(event)">격자 ON/OFF</button>
      <button onclick="fetchLatestImage(event)">새로고침</button>
    </div>
  </div>

  <script>
    // 본인의 Supabase 스토리지 공개 이미지 URL 유지
    const IMAGE_URL = 'https://jklaeltxgptsredzhiof.supabase.co/storage/v1/object/public/drawings/latest.jpg';

    const controls = document.getElementById('controls');
    let hideTimer = null;

    // 화면 터치 시 버튼 표시 & 3초 뒤 자동 사라짐
    function showControls() {
      controls.classList.add('visible');
      if (hideTimer) clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        controls.classList.remove('visible');
      }, 3000);
    }

    function handleScreenTap(e) {
      enableWakeLock();
      showControls();
    }

    // 화면 꺼짐 방지
    async function enableWakeLock() {
      try {
        if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
      } catch (err) {}
    }

    // 최신 이미지 갱신
    function fetchLatestImage(e) {
      if (e) e.stopPropagation();
      showControls();
      const img = document.getElementById('art-image');
      img.src = `${IMAGE_URL}?t=${Date.now()}`;
    }

    // 격자 토글
    function toggleGrid(e) {
      if (e) e.stopPropagation();
      showControls();
      const g = document.getElementById('grid');
      g.style.display = g.style.display === 'none' ? 'grid' : 'none';
    }

    // 첫 실행
    fetchLatestImage();
  </script>
</body>
</html>
